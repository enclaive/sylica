name: Reproduce
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SOURCE_DATE_EPOCH: 0
  # TODO pin after release
  BUILD_ENV: ghcr.io/${{ github.repository }}/build-env:latest
  TEST_ENV: ghcr.io/${{ github.repository }}/test-env:latest

jobs:
  publish-env:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Publish Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # build environment
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true

      - name: Publish environment
        id: publish
        uses: ./.github/actions/publish-env
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          image: ${{ github.repository }}/build-env

  reproduce:
    if: ${{ always() && (needs.publish-env.result == 'skipped' || needs.publish-env.result == 'success') }}
    needs: publish-env
    name: Reproduce Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # build environment
    strategy:
      fail-fast: false
      matrix:
        platform: [ debug-sev, debug-tdx, sylica-sev-oss, sylica-tdx-oss ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reproduce Build with latest environment
        if: needs.publish-env.result == 'skipped'
        uses: ./.github/actions/reproduce-build
        with:
          skip-compare: true
          platform: ${{ matrix.platform }}
          build-env: ${{ env.BUILD_ENV }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reproduce Build with published environment
        if: needs.publish-env.result == 'success'
        uses: ./.github/actions/reproduce-build
        with:
          platform: ${{ matrix.platform }}
          build-env: ghcr.io/${{ github.repository }}/build-env@${{ needs.publish-env.outputs.digest }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

  publish-test:
    name: Publish Test
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: publish-env
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # build test
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true

      - name: Publish test
        id: publish
        uses: ./.github/actions/publish-env
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          image: ${{ github.repository }}/test-env
          file: test/Dockerfile
          target: artifact
          build-args: |
            ENV_IMAGE=ghcr.io/${{ github.repository }}/build-env@${{ needs.publish-env.outputs.digest }}

  boot:
    if: ${{ always() && (needs.reproduce.result == 'success') && (needs.publish-env.result == 'skipped' || needs.publish-env.result == 'success') && (needs.publish-test.result == 'skipped' || needs.publish-test.result == 'success') }}
    needs:  [publish-env, publish-test, reproduce]
    name: Boot Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: read # pull test-env image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 mtools systemd-ukify systemd-boot-efi \
            nasm acpica-tools uuid-dev

      - name: Install bats
        env:
          BATS_TAG: v1.12.0
          BATS_COMMIT: 713504bc0224a19b3d7c7958c18dc07f64f54b44
        run: |
          git clone --depth 1 --branch "$BATS_TAG" https://github.com/bats-core/bats-core.git /tmp/bats-core
          test "$(git -C /tmp/bats-core rev-parse HEAD)" = "$BATS_COMMIT"
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Log in
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Override test environment
        if: needs.publish-test.result == 'success'
        env:
          NEW_ENV: ghcr.io/${{ github.repository }}/test-env@${{ needs.publish-test.outputs.digest }}
        run: |
          echo "TEST_ENV=$NEW_ENV" >> $GITHUB_ENV

      - name: Fetch test assets
        run: printf 'FROM %s' "$TEST_ENV" | docker build -o test/out -f - .

      - name: Build test assets
        if: false
        run: |
          docker build -f reproduce/Dockerfile --target env -t build-env .
          docker build -f test/Dockerfile --target artifact -o test/out .

      - name: Download artifacts from matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-*
          path: artifacts

      - name: Copy artifacts to out
        run: |
          mkdir -p out
          for dir in artifacts/platform-*; do
            mv "$dir" "out/${dir#artifacts/platform-}"
          done

      - name: Run boot tests
        run: test/run.sh

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serial-logs
          path: test/out/*.serial.log
          if-no-files-found: ignore
