name: Secret Scan (Full)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: enclaive/security-workflows/.github/workflows/trufflehog-full.yml@v1
    secrets:
      MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
